name: Bug report
description: Report a problem with EDBio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to trigger the problem.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11
  - type: input
    id: edbio
    attributes:
      label: EDBio version
      placeholder: "1.0.0"
  - type: textarea
    id: private-data
    attributes:
      label: Logs or screenshots
      description: Remove commander names, system names, coordinates, and full journal paths.
    validations:
      required: false
